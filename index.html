<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЕГЭ Русский язык — Свайп-тренажёр</title>
  <!-- Подключение официального SDK Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Верхняя панель: прогресс и статистика -->
    <header class="header">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="stats">
        <span class="stat-item">Карточка: <b id="counter-current">1</b>/<span id="counter-total">0</span></span>
        <span class="stat-item stat-correct">Верно: <b id="score-correct">0</b></span>
        <span class="stat-item stat-wrong">Ошибки: <b id="score-wrong">0</b></span>
      </div>
    </header>

    <!-- Игровая зона -->
    <main class="play-area">
      <!-- Боковые индикаторы выбора букв -->
      <div class="choice-badge choice-left" id="badge-left">А</div>
      <div class="choice-badge choice-right" id="badge-right">О</div>

      <!-- Стек карточек -->
      <div class="card-stack">
        <!-- Фоновая декоративная карточка для эффекта глубины -->
        <div class="card-Back"></div>

        <!-- Основная интерактивная карточка -->
        <div class="card" id="active-card">

          <!-- Лицевая сторона (вопрос) -->
          <div class="card-face card-front" id="card-front">
            <span class="topic-tag" id="card-topic">Орфография • Задание 9</span>
            <h1 class="word-title" id="card-word">заг..рать</h1>
            <p class="tap-hint">👆 Тапни по карточке, если не знаешь ответ</p>
          </div>

          <!-- Оверлей разбора (показывается при ошибке или нажатии "Не знаю") -->
          <div class="card-explanation hidden" id="card-explanation">
            <div class="status-pill" id="explanation-status">Ошибка</div>
            <h2 class="full-word" id="explanation-word">загОрать</h2>
            <div class="rule-box">
              <p id="explanation-rule">Текст правила...</p>
            </div>
            <button class="btn-primary" id="btn-next" type="button">Понятно →</button>
          </div>

        </div>
      </div>
    </main>

    <!-- Экран завершения тренировки -->
    <section class="finish-screen hidden" id="finish-screen">
      <div class="finish-card">
        <h2>Тренировка завершена! 🎉</h2>
        <p class="finish-subtitle">Все карточки пройдены. Вот твой результат:</p>
        <div class="finish-stats-grid">
          <div class="finish-stat-box correct">
            <span class="stat-value" id="final-correct">0</span>
            <span class="stat-label">Верно</span>
          </div>
          <div class="finish-stat-box wrong">
            <span class="stat-value" id="final-wrong">0</span>
            <span class="stat-label">Ошибок</span>
          </div>
          <div class="finish-stat-box skipped">
            <span class="stat-value" id="final-skipped">0</span>
            <span class="stat-label">Подсмотрено</span>
          </div>
        </div>
        <button class="btn-primary" id="btn-restart" type="button">Пройти ещё раз</button>
      </div>
    </section>

    <!-- Нижняя панель быстрых кнопок (дублирует свайпы для удобства) -->
    <footer class="footer-controls" id="footer-controls">
      <button class="control-btn btn-left" id="btn-swipe-left" type="button">
        ← <span id="btn-text-left">А</span>
      </button>
      <button class="control-btn btn-idk" id="btn-idk" type="button">
        Не знаю
      </button>
      <button class="control-btn btn-right" id="btn-swipe-right" type="button">
        <span id="btn-text-right">О</span> →
      </button>
    </footer>
  </div>

  <!-- Подключение данных и логики (type="module" позволяет использовать import/export) -->
  <script type="module" src="app.js"></script>
</body>
</html>
